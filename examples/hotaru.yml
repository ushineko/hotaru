# An example rules file, not a default.
#
# hotaru ships none of this. With no configuration at all every device OpenRGB
# reports is in scope and every decision comes from what the hardware says
# about itself -- which is what makes the program work on a machine its author
# has never seen. Rules narrow and correct; they never enable.
#
# What follows is one real desk. Every line was established by looking: light
# something, see what changed, write down the answer. Nothing here could have
# been derived from the protocol, and that is the point -- see "Mapping is a
# wizard" in specs/001.

# Uncomment to narrow hotaru to particular devices. Absent, it drives
# everything present, which is usually what you want.
#
# scope:
#   - kraken
#   - maximus

devices:
  - match: kraken
    segments:
      # Three top radiator fans, daisy-chained into one channel, eight LEDs
      # each, ordered rear to front of the case. Confirmed by lighting the
      # whole channel white: all three lit evenly, so the chain is fully
      # populated and the boundaries fall between fans.
      rad-rear:  {zone: "Hue 2 Channel 2", leds: [0, 7]}
      rad-mid:   {zone: "Hue 2 Channel 2", leds: [8, 15]}
      rad-front: {zone: "Hue 2 Channel 2", leds: [16, 23]}
      # The ring around the pump head, on the cooler's other channel. The
      # wizard asked about it and got no name, which was put down to somebody
      # not looking -- wrongly. This ring takes about half a second to show a
      # colour, and the wizard asks its question immediately, so the honest
      # answer to "what is lit now?" was whatever was there before. See #25.
      ring: {zone: "Hue 2 Channel 1"}

  - match: maximus
    # Static drives only this board's onboard LED and leaves the addressable
    # headers dark. It reports success either way, so the failure is silent
    # and the read-back cannot catch it: the mode change does take. This
    # correction is what a rules file is for.
    solid_modes: [direct, static]
    segments:
      # Two front intake fans on one header, eight LEDs each.
      front-top: {zone: "Addressable RGB Header 2", leds: [0, 7]}
      front-bot: {zone: "Addressable RGB Header 2", leds: [8, 15]}
      # The rear exhaust fan, alone on its header, so the whole zone.
      rear: {zone: "Addressable RGB Header 3"}
      # Headers 1 and 4 are empty and report sixteen LEDs each.

  - match: keychron
    # This keyboard advertises no Off mode, so "off" would resolve to Direct
    # with black -- a dead backlight rather than a dimmed one. Colour scenes
    # still reach it.
    never_blank: true
    brightness: 100

  - match: g502
    # Wireless, and it restores its onboard colour when it wakes. OpenRGB sets
    # a volatile effect and has no way to make one stick, so the colour is
    # re-sent on an interval. Sixty seconds sits under the sleep timeout with
    # margin; the real wake behaviour has never been characterised.
    reassert: 60s

# Three of this machine's nine zones -- Kraken channel 1, board headers 1 and 4
# -- have nothing attached, and every one of them accepts a write and reports
# success. A third of what the hardware advertises addresses nothing, and no
# API can say which third.
