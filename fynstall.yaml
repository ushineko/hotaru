# hotaru's installer for Windows, which fynstall (github.com/ushineko/fynstall)
# builds from this file: one program that installs the service, the CLI and
# the window, and needs no toolchain to run (spec 072 R6).
#
#   make installer        builds both programs, the icon and the installer
#
# Linux is packaged for the AUR (packaging/), so this file is for Windows only.
app:
  id: io.github.ushineko.hotaru
  name: hotaru
  # .tag's. A test holds the two together (installer_test.go).
  version: 0.1.29
  publisher: ushineko
  # Drawn from packaging/hotaru.svg by make installer.
  icon: dist/hotaru.png
  licence: LICENSE

install:
  # For everyone: the lights are the machine's, and a Windows service runs
  # for the whole computer.
  scopes: [system]
  dir:
    system: "{programs}/hotaru"

payload:
  # In bin/, not beside the uninstaller: the directory of a program on PATH
  # goes on PATH on Windows, and a program named "uninstall" does not belong
  # there.
  - src: bin/hotaru{exe}
    dst: bin/hotaru{exe}
  - src: bin/hotaru-gui{exe}
    dst: bin/hotaru-gui{exe}

actions:
  # The service of the machine. It runs as NT SERVICE\hotaru, which may
  # reach the devices, OpenRGB on localhost and its own directory, and
  # nothing an administrator has (fynstall spec 010). It makes and guards
  # %ProgramData%\hotaru itself when it starts.
  - service:
      name: hotaru
      description: hotaru lighting service
      exec: bin/hotaru{exe}
      args: [serve]
      restart: on-failure
      account: own

integration:
  # Both by name from a terminal: `hotaru light list`, `hotaru-gui`.
  path_links:
    - bin/hotaru{exe}
    - bin/hotaru-gui{exe}
  desktop:
    - name: hotaru
      generic_name: Lighting control
      comment: RGB lighting and cooler control
      exec: bin/hotaru-gui{exe}
      categories: [Utility]
      keywords: [rgb, lighting, openrgb, keyboard, cooler]
  # The rules, scenes, record and pictures are the machine's work, and
  # outlive an uninstall and an upgrade. {config} is %ProgramData% for an
  # install for everyone.
  keep_on_uninstall:
    - "{config}/hotaru"

ui:
  # The finish page offers to open the window.
  launch: bin/hotaru-gui{exe}

targets: [windows/amd64]
